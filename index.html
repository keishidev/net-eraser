<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ネット消しゴム | 防球ネット越しの写真をきれいに</title>
<meta name="description" content="球場の防球ネット越しに撮った写真から、ネットをきれいに消したり、うっすら残したりできる無料ツール。写真はアップロードされず、すべてブラウザ内で処理されます。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥎</text></svg>">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<header>
  <div class="brand">🥎 <b>ネット消しゴム</b></div>
  <div class="tagline">防球ネット越しに撮った写真から、ネットをきれいに消す・うっすら残す</div>
  <div class="privacy">🔒 写真はアップロードされません — すべての処理はお使いの端末の中だけで完結します</div>
</header>

<main>
  <!-- ===== ログイン(認証が有効な場合のみ表示) ===== -->
  <section id="login" hidden>
    <div class="logincard">
      <div class="loginicon">🔐</div>
      <p class="logintitle">ログインが必要です</p>
      <p class="loginsub">Googleアカウントでログインしてください</p>
      <div id="gsi-button"></div>
      <p id="loginmsg" class="loginmsg"></p>
    </div>
  </section>

  <!-- ===== 開始画面 ===== -->
  <section id="setup">
    <div id="drop" class="drop">
      <div class="dropicon">📷</div>
      <p class="droptitle">ここに写真をドロップ</p>
      <p class="dropsub">クリックして選択もできます（JPEG / PNG）</p>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <div class="options">
      <div class="optgroup">
        <div class="optlabel">モード</div>
        <label class="chip"><input type="radio" name="mode" value="kirara" checked>
          <span>🐹 キララ<small>マスコットの顔・肉球を自動保護</small></span></label>
        <label class="chip"><input type="radio" name="mode" value="generic">
          <span>🌏 汎用<small>その他のネット写真すべて</small></span></label>
      </div>
      <div class="optgroup">
        <div class="optlabel">仕上がり</div>
        <label class="chip"><input type="radio" name="model" value="lama" checked>
          <span>✨ 高品質<small>LaMa — 初回のみ198MB取得</small></span></label>
        <label class="chip"><input type="radio" name="model" value="migan">
          <span>⚡ 標準<small>MI-GAN — 軽量27MB・高速</small></span></label>
      </div>
    </div>
    <div id="gpustatus" class="gpustatus">🔎 お使いのGPUを確認しています…</div>
    <div id="status" class="status"></div>
  </section>

  <!-- ===== 編集画面 ===== -->
  <section id="view" hidden>
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="brushcursor" hidden></div>
      <div id="overlay" hidden>
        <div class="ovcard">
          <div class="spinner"></div>
          <div id="ovtext">準備しています…</div>
          <progress id="ovbar" value="0" max="100"></progress>
        </div>
      </div>
      <div id="hint" class="hint-chip">🖐 画像を押している間、元の写真が見えます</div>
    </div>

    <div id="controlbar" class="cbar" data-disabled="1">
      <div class="cgroup grow">
        <span class="clabel">ネットの濃さ</span>
        <input type="range" id="fade" min="0" max="100" value="35">
        <span id="fadeval" class="cval">35%</span>
      </div>
      <div class="csep"></div>
      <div class="cgroup">
        <button id="showmaskbtn" class="tbtn" title="AIが修正した場所を青く表示します">🔵 修正箇所</button>
        <button id="brushbtn" class="tbtn" title="なぞった場所を変換せず元の写真のまま残します">🖌 保護ブラシ</button>
        <input type="range" id="brushsize" min="10" max="160" value="50" title="ブラシの大きさ">
        <button id="showprotectbtn" class="tbtn on" title="保護した場所(赤)の表示を切り替えます">🔴 保護</button>
        <button id="clearprotect" class="tbtn" title="保護をすべて取り消します">↺ クリア</button>
      </div>
      <div class="csep"></div>
      <div class="cgroup">
        <button id="download" class="primary">💾 この濃さで保存</button>
        <button id="reset" class="tbtn">📁 別の写真</button>
      </div>
    </div>
    <div id="detail" class="detail"></div>
  </section>
</main>

<footer>
  <span>モデル: LaMa / MI-GAN（オープンソース）・推論: WebGPU</span>
  <span id="userchip" hidden></span>
</footer>

<script src="js/config.js?v=13"></script>
<script src="js/auth.js?v=13"></script>
<script src="js/app.js?v=13"></script>
</body>
</html>
